# Personal Decision & Problem Solver — CI on real Linux and Windows runners.
#
# This is the actual Windows runtime test: the windows job runs on a
# real Windows hosted runner (windows-latest), builds both executables
# with MinGW-w64, runs them, and exercises the HTTP API. Cross-
# compilation from Linux is NOT used as a Windows runtime test.
#
# Triggers: pushes to the PR branch, pull requests to main, and
# manual dispatch. No secrets are used; all test accounts are created
# inside temporary directories and deleted by the test scripts.

name: CI

on:
  push:
    branches: [backend-testing-dashboard, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pdps_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install libcurl/libpq development headers and psycopg2
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libpq-dev python3-psycopg2
      - name: Build console and C++ server (strict warnings)
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -o project admin.cpp backup_restore.cpp budget.cpp compare_options.cpp control.cpp daily_decision.cpp deadline_alert.cpp decision_explanation.cpp delete_confirmation.cpp error_handler.cpp export_report.cpp filter_sort.cpp habit.cpp habit_streak.cpp history.cpp income_expense.cpp input_validation.cpp login.cpp logout.cpp main.cpp multi_task_decision.cpp password_change.cpp password_validation.cpp period_report.cpp priority_calculator.cpp problem.cpp profile.cpp registration.cpp report.cpp savings_goal.cpp search_history.cpp study_planner.cpp task_prioritization.cpp task_status.cpp time_allocation.cpp
          g++ -std=c++17 -Wall -Wextra -Wpedantic -pthread -I/usr/include/postgresql -o cpp_server dashboard/cpp_server.cpp dashboard/gemini_client.cpp $(curl-config --cflags) $(curl-config --libs) -lpq
      - name: Console regression test
        run: python3 tests/console_test.py --binary ./project
      - name: API test against C++ server
        run: python3 tests/api_test.py --server-cmd "./cpp_server" --port 8123
      - name: API test against Python fallback server
        run: |
          python3 tests/api_test.py --server-cmd "python3 dashboard/server.py" --port 8124 | tee py-api-test.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "api_test: 38 passed, 0 failed" py-api-test.log
      - name: Upload Python API test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py-api-test-log-linux
          path: py-api-test.log
          if-no-files-found: warn
      - name: Gemini client test (mock, no real API)
        run: python3 tests/gemini_test.py
      - name: AI endpoints test (mock Gemini, no real API)
        run: python3 tests/ai_endpoints_test.py
      # Postgres mode (Phase 4, Batch D): the service database above is
      # test-only; pg_test.py drops and recreates the pdps tables first,
      # so it must never be pointed at a real database.
      - name: Postgres test (C++ server, service database)
        run: python3 tests/pg_test.py --server-cmd ./cpp_server --port 8190 --database-url "postgresql://postgres:testpass@localhost:5432/pdps_test"
      - name: Dashboard assets check
        run: |
          python3 - << 'PY'
          import re, pathlib, sys
          html = pathlib.Path("dashboard/index.html").read_text()
          ids = re.findall(r'id="([^"]+)"', html)
          assert len(ids) == len(set(ids)), "duplicate HTML ids"
          sections = set(re.findall(r'data-section="([^"]+)"', html))
          nav = set(re.findall(r'<button data-section="([^"]+)"', html))
          assert sections == nav, f"sections {sections} != nav {nav}"
          js = pathlib.Path("dashboard/app.js").read_text()
          btns = re.findall(r'<button[^>]*id="([^"]+)"', html)
          missing = [b for b in btns if b not in js]
          assert not missing, f"buttons without JS: {missing}"
          print(f"dashboard ok: {len(sections)} sections, {len(btns)} buttons, no duplicate ids")
          PY
      - name: Logic-priority test, standalone (own main, never in production build)
        run: |
          mkdir -p /tmp/logic-priority-test
          if git show origin/logic-priority:logic_priority.h > /tmp/logic-priority-test/logic_priority.h 2>/dev/null \
            && git show origin/logic-priority:logic_priority.cpp > /tmp/logic-priority-test/logic_priority.cpp 2>/dev/null \
            && git show origin/logic-priority:logic_priority_test.cpp > /tmp/logic-priority-test/logic_priority_test.cpp 2>/dev/null \
            && [ -s /tmp/logic-priority-test/logic_priority.h ] \
            && [ -s /tmp/logic-priority-test/logic_priority.cpp ] \
            && [ -s /tmp/logic-priority-test/logic_priority_test.cpp ]; then
            cd /tmp/logic-priority-test && g++ -std=c++17 -Wall -Wextra -o logic_priority_test logic_priority.cpp logic_priority_test.cpp && ./logic_priority_test | head -n 20
          else
            echo "SKIPPED: logic-priority branch/files not available; standalone test NOT run (not a product-code failure)"
          fi

  windows:
    name: Windows 11 runtime test (real hosted runner)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          # Use the runner image's pre-installed MSYS2: downloading the
          # installer from GitHub releases failed with HTTP 504 (2026-11-08).
          release: false
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-curl python make
          # NOTE: `make` (the MSYS2 package) is needed because
          # tests/ai_endpoints_test.py builds the server with
          # `make cpp_server`; mingw-w64-x86_64-make alone only
          # provides mingw32-make, not `make`.
      - name: Build console and C++ server with MinGW
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -o project.exe admin.cpp backup_restore.cpp budget.cpp compare_options.cpp control.cpp daily_decision.cpp deadline_alert.cpp decision_explanation.cpp delete_confirmation.cpp error_handler.cpp export_report.cpp filter_sort.cpp habit.cpp habit_streak.cpp history.cpp income_expense.cpp input_validation.cpp login.cpp logout.cpp main.cpp multi_task_decision.cpp password_change.cpp password_validation.cpp period_report.cpp priority_calculator.cpp problem.cpp profile.cpp registration.cpp report.cpp savings_goal.cpp search_history.cpp study_planner.cpp task_prioritization.cpp task_status.cpp time_allocation.cpp
          g++ -std=c++17 -Wall -Wextra -Wpedantic -pthread -o cpp_server.exe dashboard/cpp_server.cpp dashboard/gemini_client.cpp $(curl-config --cflags) $(curl-config --libs) -lws2_32
          ls -lh project.exe cpp_server.exe
      - name: Console regression test
        shell: msys2 {0}
        run: python3 tests/console_test.py --binary ./project.exe
      - name: API test against C++ server
        shell: msys2 {0}
        run: python3 tests/api_test.py --server-cmd "./cpp_server.exe" --port 8125
      - name: API test against Python fallback server
        shell: msys2 {0}
        run: |
          python3 tests/api_test.py --server-cmd "python3 dashboard/server.py" --port 8126 | tee py-api-test.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "api_test: 38 passed, 0 failed" py-api-test.log
      - name: Upload Python API test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py-api-test-log-windows
          path: py-api-test.log
          if-no-files-found: warn
      - name: AI endpoints test (mock Gemini, no real API)
        shell: msys2 {0}
        run: python3 tests/ai_endpoints_test.py
      - name: Server startup and shutdown check
        shell: pwsh
        # Safety net: this step must never hang indefinitely again
        # (CI #17: the old MSYS2 `kill`/`wait` hung for 34m because a
        # POSIX SIGTERM does not reliably stop a native MinGW .exe).
        # CI #18 failed opaquely (server never answered 200; root
        # cause UNKNOWN from the log), so this step now logs the PID,
        # working directory, every poll result and the server's own
        # logs, and the logs are uploaded as an artifact on every run.
        # CI #19 proved the server dies instantly under PowerShell
        # (HasExited=True before poll 0, empty logs): the MinGW DLLs
        # are not on a PowerShell step's PATH, so the Windows loader
        # kills the process before main() runs. The PATH fix below
        # restores them; ExitCode in the throw proves it if it recurs.
        timeout-minutes: 5
        run: |
          # Windows-native process management: Start-Process -PassThru
          # gives the real Windows PID, Stop-Process ends it with
          # TerminateProcess, and Wait-Process -Timeout bounds the
          # shutdown. The finally block guarantees cleanup even when
          # the 200 check fails, and a server that will not stop
          # fails the step loudly instead of hanging forever.
          $srv = $null
          $ok = $false
          try {
            Write-Host "working directory: $(Get-Location)"
            Write-Host "dashboard/index.html present: $(Test-Path dashboard/index.html)"
            # The MinGW-built server needs its DLLs (libcurl, libstdc++,
            # libgcc, libwinpthread) from mingw64/bin. MSYS2 shells have
            # that on PATH, but PowerShell steps do not. Resolve the
            # install location from the setup-msys2 output (no hardcode).
            $mingwBin = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
            if (-not (Test-Path $mingwBin)) { throw "MinGW bin directory not found: $mingwBin" }
            $env:Path = "$mingwBin;" + $env:Path
            Write-Host "MinGW bin added to PATH: $mingwBin"
            try {
              $srv = Start-Process -FilePath .\cpp_server.exe -ArgumentList '--port','8127','--data-dir','.' -WorkingDirectory (Get-Location).Path -NoNewWindow -PassThru -RedirectStandardOutput server.log -RedirectStandardError server-error.log -ErrorAction Stop
            } catch {
              throw "server process failed to start: $($_.Exception.Message)"
            }
            if (-not $srv) { throw "server process failed to start" }
            Write-Host "started server PID $($srv.Id), HasExited=$($srv.HasExited)"
            for ($i = 0; $i -lt 30; $i++) {
              $code = $null
              $exit = $null
              try {
                $code = (curl.exe -s -o NUL -w "%{http_code}" http://127.0.0.1:8127/)
                $exit = $LASTEXITCODE
              } catch { $exit = "exception: $($_.Exception.Message)" }
              Write-Host "poll ${i}: curl exit=$exit http=$code server-exited=$($srv.HasExited)"
              if ($code -eq "200") { $ok = $true; break }
              Start-Sleep -Seconds 1
            }
            $exitCode = "n/a"
            if ($srv.HasExited) { $exitCode = $srv.ExitCode }
            if (-not $ok) { throw "server did not answer 200 on / within 30s (PID $($srv.Id), HasExited=$($srv.HasExited), ExitCode=$exitCode)" }
            Write-Host "root status: 200"
            if ($srv.HasExited) { throw "server exited unexpectedly after answering 200" }
          }
          finally {
            if ($srv -and -not $srv.HasExited) {
              Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
              try { Wait-Process -Id $srv.Id -Timeout 10 -ErrorAction Stop } catch { }
              if (-not $srv.HasExited) { Write-Error "server did not stop within 10s"; exit 1 }
            }
            if (-not $ok) {
              Write-Host "--- server.log ---"
              if (Test-Path server.log) { Get-Content server.log -ErrorAction SilentlyContinue } else { Write-Host "(no server.log)" }
              Write-Host "--- server-error.log ---"
              if (Test-Path server-error.log) { Get-Content server-error.log -ErrorAction SilentlyContinue } else { Write-Host "(no server-error.log)" }
            }
          }
          Write-Host "server stopped, exit code check done"
      - name: Upload server startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-logs
          path: |
            server.log
            server-error.log
          if-no-files-found: warn
